<!DOCTYPE html>
<html>
<head>
    <title>WebXR Escape Room</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script>
        // Your game code goes here
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            
            // 1. Setup Desktop Camera (For testing without headset)
            const camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 1.6, -2), scene);
            camera.attachControl(canvas, true); // Allows mouse look and WASD
            camera.keysUp.push(87); // W
            camera.keysDown.push(83); // S
            camera.keysLeft.push(65); // A
            camera.keysRight.push(68); // D

            // 2. Add Light
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

            // 3. Add Floor
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 10, height: 10}, scene);

            // 4. Add a "Key" Cube to test grabbing
            const key = BABYLON.MeshBuilder.CreateBox("key", {size: 0.2}, scene);
            key.position.y = 1;
            key.position.z = 1;

            // 5. Setup WebXR (This will gracefully fail on desktop, letting you use the keyboard camera)
            const xrHelper = await scene.createDefaultXRExperienceAsync({
                floorMeshes: [ground],
                optionalFeatures: ["hit-testing", "anchors"]
            });

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(() => scene.render());
            window.addEventListener("resize", () => engine.resize());
        });
    </script>
</body>
</html>
